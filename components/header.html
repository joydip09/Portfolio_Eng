<!-- ============================================================
     HEADER.HTML — Sticky Navigation Component
     Include this at the top of every page.
     Usage: fetch('/components/header.html') or copy inline.
     ============================================================ -->

<!-- Reading Progress Bar (shown on project pages) -->
<div id="reading-progress" style="
  position: fixed;
  top: 0;
  left: 0;
  height: 3px;
  width: 0%;
  background: linear-gradient(90deg, #008080, #3EB489);
  z-index: 1001;
  transition: width 0.1s linear;
"></div>

<header class="nav" role="banner">
  <div class="nav__inner">

    <!-- Logo -->
    <a href="/" class="nav__logo">
      <div class="nav__logo-mark">J</div>
      <span>Joy</span>
    </a>

    <!-- Desktop Links -->
    <nav class="nav__links" aria-label="Primary navigation">
      <a href="/"              class="nav__link">Home</a>
      <a href="/projects/"     class="nav__link">Projects</a>
      <a href="/about.html"    class="nav__link">About</a>
      <a href="/about.html#contact" class="nav__link">Contact</a>
    </nav>

    <!-- Actions -->
    <div class="nav__actions">
      <a href="https://github.com/" target="_blank" rel="noopener" class="btn btn--ghost btn--sm">
        GitHub ↗
      </a>
      <!-- Hamburger for mobile -->
      <button class="nav__hamburger" aria-label="Toggle menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

  </div>

  <!-- Mobile Menu -->
  <nav class="nav__mobile" aria-label="Mobile navigation">
    <a href="/"              class="nav__link">Home</a>
    <a href="/projects/"     class="nav__link">Projects</a>
    <a href="/about.html"    class="nav__link">About</a>
    <a href="/about.html#contact" class="nav__link">Contact</a>
    <a href="https://github.com/" target="_blank" rel="noopener" class="btn btn--outline" style="width:fit-content;">
      GitHub ↗
    </a>
  </nav>
</header>
